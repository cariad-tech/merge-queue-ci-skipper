name: 'Merge Queue CI Check Skipper'
description: 'Outputs `skip-check` as `true` if this is running as part of merge queue checks and the same checks have already been executed in the PR itself.'
inputs:
  secret:
    description: 'Optional GitHub Secret that can read classic branch protection using the administration:read permission. Only needed for a branch protected by classic branch protection: the required checks of a ruleset are read with the workflow token.'
    required: false
outputs:
  skip-check:
    description: "Skip Check (boolean)"
    value: ${{ steps.passed-checks.outputs.can-skip-checks }}
runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Extract PR Number and Commit ID
      id: extract-pr-info
      uses: actions/github-script@v9
      with:
        script: |
          const githubRef = process.env.GITHUB_REF;
          const regex = /^refs\/heads\/gh-readonly-queue\/([a-zA-Z0-9.\-_\/]+)\/pr-(\d+)-([a-f0-9]+)$/;

          if (regex.test(githubRef)) {
            const [, targetBranchName, prNumber, commitId] = githubRef.match(regex);
            core.setOutput('targetBranchName', targetBranchName);
            core.setOutput('prNumber', prNumber);
            core.setOutput('commitId', commitId);
          } else {
            console.log(`GITHUB_REF is not a merge queue ref, setting CAN_SKIP_CHECKS to false: ${githubRef}`);
            core.exportVariable('CAN_SKIP_CHECKS', 'false');
          }

    - name: Print PR Number and Target Commit ID
      if: env.CAN_SKIP_CHECKS != 'false'
      shell: bash
      run: |
        echo "Target Branch Name: ${{ steps.extract-pr-info.outputs.targetBranchName }}"
        echo "PR Number: ${{ steps.extract-pr-info.outputs.prNumber }}"
        echo "Target Commit ID: ${{ steps.extract-pr-info.outputs.commitId }}"

    - name: Check if merge queue entry was enqueued as head of the queue
      if: env.CAN_SKIP_CHECKS != 'false'
      shell: bash
      run: |
        targetBranchHead=$(git rev-parse origin/${{ steps.extract-pr-info.outputs.targetBranchName }})
        if [[ "$targetBranchHead" != "${{ steps.extract-pr-info.outputs.commitId }}" ]]; then
          echo "'${{ steps.extract-pr-info.outputs.targetBranchName }}' branch commit ID does not match PR commit ID. This Merge Queue run was not head of the queue when it was enqueued. Setting CAN_SKIP_CHECKS to false."
          echo "CAN_SKIP_CHECKS=false" >> "$GITHUB_ENV"
        else
          echo "This merge queue entry is targeting '${{ steps.extract-pr-info.outputs.targetBranchName }}' directly."
        fi

    - name: Get PR Branch
      id: get-pr-branch
      if: env.CAN_SKIP_CHECKS != 'false'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        prNumber=${{ steps.extract-pr-info.outputs.prNumber }}
        branchName=$(gh pr view ${prNumber} --json headRefName -q '.headRefName')
        echo "prBranch=$branchName" >> "$GITHUB_OUTPUT"

    - name: Print PR Branch
      if: env.CAN_SKIP_CHECKS != 'false'
      shell: bash
      run: |
        echo "PR Branch: ${{ steps.get-pr-branch.outputs.prBranch }}"

    - name: Check if PR branch contains the Merge Queue target commit ID
      if: env.CAN_SKIP_CHECKS != 'false'
      shell: bash
      run: |
        # Get the branch name from previous steps
        branch_name="origin/${{ steps.get-pr-branch.outputs.prBranch }}"
        commit_id="${{ steps.extract-pr-info.outputs.commitId }}"

        # Check if the branch history contains the commit
        if git branch -r --contains "$commit_id" | grep -q "$branch_name"; then
          echo "Branch '$branch_name' contains commit '$commit_id'. It is up to date with ${{ steps.extract-pr-info.outputs.targetBranchName }}."
        else
          echo "Branch '$branch_name' does not contain commit '$commit_id'. It is outdated. Setting CAN_SKIP_CHECKS to false."
          echo "CAN_SKIP_CHECKS=false" >> "$GITHUB_ENV"
        fi

    - name: Compare PR Branch with Current Branch
      if: env.CAN_SKIP_CHECKS != 'false'
      shell: bash
      run: |
        if git diff --quiet "origin/${{ steps.get-pr-branch.outputs.prBranch }}"; then
          echo "No differences found. PR branch is identical with this merge queue branch."
        else
          echo "Differences detected. PR branch has been updated after PR was added to merge queue. Setting CAN_SKIP_CHECKS to false."
          echo "CAN_SKIP_CHECKS=false" >> "$GITHUB_ENV"
        fi

    - name: Compute/publish skip result
      id: passed-checks
      uses: actions/github-script@v9
      env:
        SECRET: ${{ inputs.secret }}
      with:
        github-token: ${{ inputs.secret != '' && inputs.secret || github.token }}
        script: |
          if (process.env.CAN_SKIP_CHECKS == "false") {
            console.log("Setting CAN_SKIP_CHECKS to false");
            core.setOutput("can-skip-checks", false);
            return;
          }

          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const branch = "${{ steps.extract-pr-info.outputs.targetBranchName }}";
          const requiredCheckNames = new Set();

          // Reports the rules that reach the branch, from repository, organisation
          // and enterprise rulesets alike, with their conditions already
          // evaluated. The workflow token reads it without any permission.
          const rules = await github.paginate(github.rest.repos.getBranchRules, {
            owner,
            repo,
            branch,
            per_page: 100,
          });
          for (const rule of rules.filter(rule => rule.type === "required_status_checks")) {
            for (const check of rule.parameters.required_status_checks) {
              requiredCheckNames.add(check.context);
            }
          }

          // Classic branch protection can require checks of its own. Reading it
          // needs administration:read permission, which cannot be granted to
          // GITHUB_TOKEN. Instead, a PAT or app token must be passed as the
          // 'secret' input. For branches without classic branch protection, 404
          // is returned.
          if (process.env.SECRET) {
            try {
              const { data: protection } = await github.rest.repos.getBranchProtection({ owner, repo, branch });
              for (const checkContext of protection.required_status_checks?.contexts ?? []) {
                requiredCheckNames.add(checkContext);
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              console.log(`${branch} has no classic branch protection.`);
            }
          }

          const ref = "refs/heads/${{ steps.get-pr-branch.outputs.prBranch }}";
          let checkRuns;
          try {
            checkRuns = await github.paginate(github.rest.checks.listForRef, {
              owner,
              repo,
              ref,
              per_page: 100,
            });
          } catch (error) {
            throw error.status === 403
              ? new Error(`Cannot read the check runs of ${ref}: ${error.message}. This job needs the checks: read permission.`)
              : error;
          }
          console.log(`check runs on ${ref} = ${checkRuns.map(check => `${check.status},${check.conclusion},${check.name};`)}`);

          let unsuccessfulChecks;
          if (requiredCheckNames.size > 0) {
            console.log(`requiredCheckNames = ${[...requiredCheckNames]}`);
            // A required name with no run at all is considered unsuccessful.
            unsuccessfulChecks = [...requiredCheckNames].filter(checkName => {
              const runs = checkRuns.filter(check => check.name === checkName);
              return runs.length === 0 || !runs.every(check => check.status === "completed" && check.conclusion === "success");
            });
          } else { // No required checks known
            const cause = process.env.SECRET
              ? `Neither a ruleset nor classic branch protection requires a status check on ${branch}`
              : `No ruleset requires a status check on ${branch}, and classic branch protection cannot be read without the 'secret' input`;
            core.warning(`${cause}, so the merge queue checks are only skipped if there is at least one check run on the pull request, and every check run passed or was skipped. Requiring the checks explicitly - in a ruleset, or in classic branch protection with a token passed as 'secret' - verifies their success by name instead.`);
            unsuccessfulChecks = checkRuns.length > 0
              ? checkRuns
                  .filter(check => check.status !== "completed" || !["success", "skipped"].includes(check.conclusion))
                  .map(check => check.name)
              : [`no check run on ${ref}`];
          }

          if (unsuccessfulChecks.length > 0) {
            console.log(`Checks not passed, cannot skip merge queue checks. Setting CAN_SKIP_CHECKS to false. Unsuccessful checks: ${unsuccessfulChecks.join(', ')}`);
            core.setOutput("can-skip-checks", false);
          } else {
            console.log("All required checks successful. Setting CAN_SKIP_CHECKS to true.");
            core.setOutput("can-skip-checks", true);
          }
